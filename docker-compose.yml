##

version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    
    # Porta padrão do Ollama
    ports:
      - "11434:11434"
    
    # Volume para persistir modelos baixados
    volumes:
      - ollama_data:/root/.ollama
      # Opcional: compartilhar arquivos com host
      # - ./ollama_models:/models
      # - ./ollama_data:/root/.ollama
    
    # Variáveis de ambiente
    environment:
      # Aumentar tamanho de contexto (opcional)
      # - OLLAMA_NUM_PARALLEL=1
      # - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_HOST=0.0.0.0:11434
    
    # ========================================
    # GPU SUPPORT (descomente se usar GPU)
    # ========================================
    # Para NVIDIA GPU (CUDA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    
    # ========================================
    # RESTART POLICY
    # ========================================
    restart: unless-stopped
    
    # Healthcheck (opcional)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Limites de recursos (opcional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 8G
    #     reservations:
    #       cpus: '2'
    #       memory: 4G

volumes:
  ollama_data:
    driver: local

# ========================================
# COMO USAR:
# ========================================
# 1. SUBIR O CONTAINER:
#    docker-compose -f docker-compose-ollama.yml up -d
#
# 2. VERIFICAR SE ESTÁ RODANDO:
#    docker-compose -f docker-compose-ollama.yml ps
#    curl http://localhost:11434/api/tags
#
# 3. PUXAR UM MODELO (execute dentro do container):
#    docker-compose -f docker-compose-ollama.yml exec ollama ollama pull llama2
#    docker-compose -f docker-compose-ollama.yml exec ollama ollama pull mistral
#    docker-compose -f docker-compose-ollama.yml exec ollama ollama pull neural-chat
#
# 4. LISTAR MODELOS RODANDO:
#    docker-compose -f docker-compose-ollama.yml exec ollama ollama list
#
# 5. TESTAR COM CURL:
#    curl http://localhost:11434/api/generate -d '{
#      "model": "llama2",
#      "prompt": "Olá, tudo bem?",
#      "stream": false
#    }'
#
# 6. PARAR O CONTAINER:
#    docker-compose -f docker-compose-ollama.yml down
#
# 7. USAR COM CLAUDE CODE:
#    export ANTHROPIC_BASE_URL="http://localhost:11434"
#    export ANTHROPIC_API_KEY="ollama"
#    export CLAUDE_MODEL="llama2"  # ou outro modelo
#    claude -p "seu prompt aqui"
